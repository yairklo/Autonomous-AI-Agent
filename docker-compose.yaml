services:
  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8787
      - HEADLESS_BROWSER=true
      # Headless CLI: Claude uses -p + bypassPermissions; Cursor uses -p --force --trust
      - CI=1
      - CLAUDE_BIN=claude
      - CURSOR_BIN=agent
      - NO_OPEN_BROWSER=1
      # Persist git identity via volume (named volumes cannot bind a single file)
      - GIT_CONFIG_GLOBAL=/root/.git-config-data/gitconfig
      # External coding workspace (JoinUpApp clone lives here)
      - JOINUP_PROJECT_ROOT=/workspaces/JoinUpApp
      - JOINUP_GIT_REPO=https://github.com/yairklo/JoinUpApp.git
      - JOINUP_GITHUB_REPO=yairklo/JoinUpApp
      - WORKSPACE_BOOTSTRAP_STRICT=1
      # Inject secrets via Coolify environment variables:
      # GITHUB_TOKEN (required for clone/push), TELEGRAM_*, JOINUP_TELEGRAM_*,
      # GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL
    volumes:
      # WhatsApp LocalAuth session (survives redeploys)
      - wwebjs_auth:/app/.wwebjs_auth
      # Excel tracker, jobs DB, failure screenshots
      - app_data:/app/data
      # CV PDF and other application assets
      - app_assets:/app/assets
      # Claude CLI subscription auth / session state
      - claude_config:/root/.claude
      # Cursor CLI subscription auth / session state
      - cursor_config:/root/.cursor
      # Git identity for automated commits (see GIT_CONFIG_GLOBAL)
      - git_config:/root/.git-config-data
      # Persistent clones of external repos (JoinUpApp, etc.)
      - app_workspaces:/workspaces
    restart: unless-stopped
    # Interactive one-time login from Coolify terminal / SSH needs a TTY:
    #   docker compose exec -it app npm run auth:cli

volumes:
  wwebjs_auth:
  app_data:
  app_assets:
  claude_config:
  cursor_config:
  git_config:
  app_workspaces:
