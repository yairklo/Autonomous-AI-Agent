# Optional local multi-service stack (mirrors Coolify's two independent apps).
# Prefer deploying each Dockerfile as its own Coolify application for per-service
# CPU/RAM metrics. Compose here is only for local smoke / wiring checks.
#
# Coolify apps (recommended):
#   1) voice-agent         → Dockerfile.app
#   2) joinup-telegram     → Dockerfile.joinup-telegram
#      set VOICE_AGENT_URL to the voice-agent public/private URL
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8787
      - HEADLESS_BROWSER=true
      # Headless CLI: Claude uses -p + bypassPermissions; Cursor uses -p --force --trust
      # CI is managed via Coolify UI (not hardcoded here)
      - CLAUDE_BIN=claude
      - CURSOR_BIN=agent
      - NO_OPEN_BROWSER=1
      # Persist git identity via volume (named volumes cannot bind a single file)
      - GIT_CONFIG_GLOBAL=/root/.git-config-data/gitconfig
      # External coding workspaces (git clones; see workspaces.json)
      - JOINUP_PROJECT_ROOT=/workspaces/JoinUpApp
      - JOINUP_GIT_REPO=https://github.com/yairklo/JoinUpApp.git
      - JOINUP_GITHUB_REPO=yairklo/JoinUpApp
      - AGENT_PROJECT_ROOT=/workspaces/Autonomous-AI-Agent
      - PORTFOLIO_PROJECT_ROOT=/workspaces/portfolio
      - ECODRIVE_PROJECT_ROOT=/workspaces/EcoDrive
      - WORKSPACE_BOOTSTRAP_STRICT=1
      # Keep Telegram as a separate process/container (Coolify metrics + isolation)
      - JOINUP_TELEGRAM_AUTOSTART=0
      # Inject secrets via Coolify / compose env file:
      # GITHUB_TOKEN (required for clone/push to all workspaces), TELEGRAM_*, JOINUP_TELEGRAM_*,
      # GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL
    volumes:
      - wwebjs_auth:/app/.wwebjs_auth
      - app_data:/app/data
      - app_assets:/app/assets
      - claude_config:/root/.claude
      - cursor_config:/root/.cursor
      - git_config:/root/.git-config-data
      - app_workspaces:/workspaces
    restart: unless-stopped
    # Interactive one-time login from Coolify terminal / SSH needs a TTY:
    #   docker compose exec -it app npm run auth:cli

  joinup-telegram:
    build:
      context: .
      dockerfile: Dockerfile.joinup-telegram
    environment:
      - NODE_ENV=production
      - CLAUDE_BIN=claude
      - CURSOR_BIN=agent
      - NO_OPEN_BROWSER=1
      - GIT_CONFIG_GLOBAL=/root/.git-config-data/gitconfig
      - JOINUP_PROJECT_ROOT=/workspaces/JoinUpApp
      - JOINUP_GIT_REPO=https://github.com/yairklo/JoinUpApp.git
      - JOINUP_GITHUB_REPO=yairklo/JoinUpApp
      - AGENT_PROJECT_ROOT=/workspaces/Autonomous-AI-Agent
      - PORTFOLIO_PROJECT_ROOT=/workspaces/portfolio
      - ECODRIVE_PROJECT_ROOT=/workspaces/EcoDrive
      - WORKSPACE_BOOTSTRAP_STRICT=1
      - AGENT_ACTIVITY_PERSIST=0
      # Explicit URL — do not rely on implicit Docker DNS alone in Coolify.
      # Local compose convenience value (override in Coolify with the public app URL):
      - VOICE_AGENT_URL=http://app:8787
      # Required secrets (compose env / Coolify UI):
      # JOINUP_TELEGRAM_BOT_TOKEN, ALLOWED_TELEGRAM_USER_IDS, GITHUB_TOKEN,
      # optional VERCEL_*, RENDER_*
    volumes:
      - app_data:/app/data
      - claude_config:/root/.claude
      - cursor_config:/root/.cursor
      - git_config:/root/.git-config-data
      - app_workspaces:/workspaces
    depends_on:
      - app
    restart: unless-stopped

volumes:
  wwebjs_auth:
  app_data:
  app_assets:
  claude_config:
  cursor_config:
  git_config:
  app_workspaces:
