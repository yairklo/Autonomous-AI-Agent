<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock Job Application Form</title>
</head>
<body>
  <h1>Apply for Full Stack Developer</h1>
  <form id="apply-form" action="/submit" method="POST" enctype="multipart/form-data">
    <div>
      <label>Full Name:</label>
      <input type="text" name="full_name" required>
    </div>
    <div>
      <label>Email Address:</label>
      <input type="email" name="user_email" required>
    </div>
    <div>
      <label>Phone Number:</label>
      <input type="tel" name="phone_num">
    </div>
    <div>
      <label>LinkedIn Profile:</label>
      <input type="text" id="linkedin_url" name="linkedin">
    </div>
    <div>
      <label>GitHub Profile:</label>
      <input type="text" name="github_url">
    </div>
    <div>
      <label>Cover Letter:</label>
      <textarea name="cover_letter" rows="4"></textarea>
    </div>
    <div>
      <label>Resume (PDF):</label>
      <input type="file" name="resume_file" accept=".pdf">
    </div>
    <button type="submit">Submit Application</button>
  </form>
  <script>
    document.getElementById('apply-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.body.innerHTML = '<h2>Application Submitted Successfully!</h2>';
    });
  </script>
</body>
</html>
